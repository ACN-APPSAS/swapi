services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swapi
      POSTGRES_USER: swapi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swapi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swapi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file:
      - .env
    environment:
      # Overrides .env so the app always connects to the compose db service
      DATABASE_URL: postgres://swapi:${DB_PASSWORD:-swapi}@db:5432/swapi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
