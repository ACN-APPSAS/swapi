name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: run the test suite ────────────────────────────────────────────────
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python manage.py test --verbosity=2
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"

  # ── Job 2: build multi-stage image and push to GHCR ─────────────────────────
  # Runs only on pushes to the default branch (not on pull requests).
  build-and-push:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags:
      #   latest  — always points to the most recent push on the default branch
      #   sha-…   — immutable tag for each commit (safe for rollback)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use layer cache from previous CI runs to speed up pip installs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass a disposable SECRET_KEY for the collectstatic build step only.
          # The real SECRET_KEY must be injected at runtime via environment variables.
          build-args: |
            COLLECTSTATIC_SECRET_KEY=collectstatic-placeholder-not-for-runtime
